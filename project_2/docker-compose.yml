version: '3.9'

services:

  mysql:
    image: mysql:8.0
    restart: always
    container_name: mysql-container

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoapp

    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-app:
    build: .
    container_name: spring-backend

    ports:
      - "8082:8080"
    restart: always
    depends_on:
      # - mysql
      mysql:
        condition: service_healthy
volumes:
  Database:
    external: true