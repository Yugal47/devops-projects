name: Deploy devops_project1
on:
  push:
    paths:
      - 'project_1/**'
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /apps/devops-projects/project_1
          git pull origin main
          docker compose up --build -d
