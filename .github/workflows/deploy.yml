name: Deploy devops_project1
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy Via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ugal_iwari
          key: ${{secrets.SSH_KEY}}
          script: |
            cd /apps/devops-projects
            git pull
            docker compose up --build -d

