name: Deploy devops_project1
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          whoami
          id
          pwd
          echo $GITHUB_WORKSPACE
          ls -ld $GITHUB_WORKSPACE
          git pull origin main
          cd /apps/devops-projects/project_1
          docker compose up --build -d
