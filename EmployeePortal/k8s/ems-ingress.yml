apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-ingress
  namespace: ep
spec:
  rules:
  - host: ems.local
    http:
      paths:

      # FRONTEND (React SPA)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      # BACKEND APIs
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /employees
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
