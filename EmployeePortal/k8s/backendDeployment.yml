apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ep
  name: backend-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432
          do
            echo "Waiting for postgres..."
            sleep 2
          done
      containers:
      - name: backend
        image: yugal47/employeeportalbackend:latest
        ports:
        - containerPort: 5000
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: config
              key: db_name
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: config
              key: db_port
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: secret
              key: username

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret
              key: password
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: config
              key: db_host
