version: '3.9'
services:
  frontend:
    image: nginx:latest
    build: ./frontend
  backend:
    build: ./backend
    ports:
      - "5000:5000"
  nginx_proxy:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend