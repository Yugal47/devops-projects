version: '3.9'
services:
  backend: 
    build: ./backend
    ports:
      - "5000:5000"
  
  frontend:
    image: nginx:latest
    volumes:
      - ./app_devops:/usr/share/nginx/html
    
  nginx_proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend  