version: '3.9'
services:  
  frontend:
    image: nginx:latest
    build: ./frontend
  backend: 
    build: ./backend
    ports:
      - "5000:5000"
    
  nginx_proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend  
